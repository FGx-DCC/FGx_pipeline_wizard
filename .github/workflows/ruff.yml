name: Lint & Format

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"

jobs:
  lint:
    name: Ruff Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "check . --output-format=github"

  format:
    name: Ruff Formatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Ruff formatter
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "format --diff ."
