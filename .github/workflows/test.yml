name: Test

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"

jobs:
  test: 
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests 
        shell: bash -l {0}
        run: |
          pytest tests/ -vv

